/* ═══ RESET + SHARED VARIABLES ════════════════════════════════ */
:root{
  /* Home / Index palette */
  --g1:#4A5FD5;--g2:#7B4FA8;--g3:#C56B9E;
  --acc:#E8A020;--acc2:#F5C842;
  --ban1:#F5A623;--ban2:#E8415A;
  --bg:#F0F4F8;--card:#fff;
  --ink:#1A1A2E;--muted:#6B7280;
  --grad:linear-gradient(135deg,var(--g1),var(--g2),var(--g3));
  /* Game palette */
  --white:#ffffff;--deep:#1a1060;
  --border:#e2e8f0;--shadow:0 4px 24px rgba(74,95,213,.13);
  --shadow-sm:0 2px 8px rgba(0,0,0,.08);
  --ok:#22c55e;--err:#ef4444;
}

/* ═══ HOME CSS (from home.html) ════════════════════════════════ */

:root {
  --g1:#4A5FD5; --g2:#7B4FA8; --g3:#C56B9E;
  --acc:#E8A020; --acc2:#F5C842;
  --ban1:#F5A623; --ban2:#E8415A;
  --bg:#F0F4F8; --card:#FFFFFF;
  --ink:#1A1A2E; --muted:#6B7280;
  --grad: linear-gradient(135deg, var(--g1), var(--g2), var(--g3));
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;overflow-x:hidden}

/* ── BANNER ── */
.banner{
  background:linear-gradient(90deg,var(--ban1),var(--ban2));
  padding:10px 24px;text-align:center;
  font-size:13px;font-weight:600;color:#fff;letter-spacing:.3px;
}
.banner a{color:#fff;font-weight:800;text-decoration:underline}

/* ── NAV ── */
nav{
  background:rgba(255,255,255,.95);backdrop-filter:blur(12px);
  padding:14px 60px;display:flex;align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(74,95,213,.12);
  position:sticky;top:0;z-index:100;
}
.nav-logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.nav-logo-text{font-size:20px;font-weight:800;color:var(--ink)}
.nav-logo-text span{background:var(--grad);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.nav-links{display:flex;gap:28px}
.nav-links a{font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;transition:color .2s}
.nav-links a:hover{color:var(--g2)}
.nav-cta{
  background:var(--grad);color:#fff;
  padding:10px 24px;border-radius:50px;
  font-size:14px;font-weight:700;text-decoration:none;
  box-shadow:0 4px 16px rgba(123,79,168,.35);
  transition:all .2s;
}
.nav-cta:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(123,79,168,.45)}

/* ── HERO ── */
.hero{
  background:var(--grad);
  padding:90px 60px 110px;
  text-align:center;position:relative;overflow:hidden;
  color:#fff;
}
/* big Hebrew letter bg */
.hero::before{
  content:'א';font-family:'David',Georgia,'Times New Roman',serif;
  font-size:600px;font-weight:900;
  color:rgba(255,255,255,.04);
  position:absolute;right:-80px;top:50%;transform:translateY(-52%);
  line-height:1;pointer-events:none;user-select:none;
}
.hero-inner{position:relative;z-index:2;max-width:760px;margin:0 auto}

.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
  padding:7px 18px;border-radius:30px;
  font-size:12px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;color:#fff;
  margin-bottom:28px;backdrop-filter:blur(8px);
  animation:fadeUp .5s ease both;
}
.badge-dot{width:7px;height:7px;border-radius:50%;background:var(--acc2);
  animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.hero h1{
  font-size:clamp(42px,6vw,76px);font-weight:900;
  line-height:1.05;letter-spacing:-2px;
  margin-bottom:22px;
  animation:fadeUp .5s .1s ease both;
}
.hero h1 em{font-style:normal;color:var(--acc2)}

.hero-sub{
  font-size:clamp(16px,2vw,20px);font-weight:300;
  color:rgba(255,255,255,.82);line-height:1.7;
  max-width:560px;margin:0 auto 40px;
  animation:fadeUp .5s .2s ease both;
}
.hero-sub b{color:#fff;font-weight:600}

.hero-btns{
  display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
  animation:fadeUp .5s .3s ease both;
}
.btn-hero-main{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--acc);color:var(--ink);
  padding:16px 36px;border-radius:50px;
  font-size:17px;font-weight:800;text-decoration:none;
  box-shadow:0 6px 28px rgba(232,160,32,.45);
  transition:all .2s;
}
.btn-hero-main:hover{transform:translateY(-2px);box-shadow:0 10px 36px rgba(232,160,32,.55)}
.btn-hero-ghost{
  display:inline-flex;align-items:center;gap:8px;
  border:2px solid rgba(255,255,255,.4);color:#fff;
  padding:16px 30px;border-radius:50px;
  font-size:16px;font-weight:600;text-decoration:none;
  backdrop-filter:blur(6px);transition:all .2s;
}
.btn-hero-ghost:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.7)}

/* stats bar */
.hero-stats{
  display:flex;gap:0;justify-content:center;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  border-radius:20px;padding:0;margin:52px auto 0;
  max-width:520px;backdrop-filter:blur(8px);
  overflow:hidden;
  animation:fadeUp .5s .4s ease both;
}
.hstat{flex:1;padding:20px 12px;text-align:center;border-right:1px solid rgba(255,255,255,.15)}
.hstat:last-child{border-right:none}
.hstat-n{font-size:30px;font-weight:900;color:#fff}
.hstat-n sup{font-size:15px;color:var(--acc2)}
.hstat-l{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px;font-weight:400}

/* wave divider */
.wave{display:block;width:100%;margin-bottom:-2px}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

/* ── SECTIONS ── */
.section{padding:80px 60px}
.section-alt{background:#fff}
.sec-tag{
  display:inline-block;font-size:11px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  color:var(--g2);margin-bottom:14px;
}
.sec-h2{
  font-size:clamp(28px,4vw,46px);font-weight:800;
  line-height:1.1;letter-spacing:-1px;
  margin-bottom:16px;max-width:600px;
}
.sec-sub{
  font-size:16px;color:var(--muted);line-height:1.7;
  max-width:540px;margin-bottom:50px;font-weight:400;
}

/* ── HOW IT WORKS ── */
.how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.how-card{
  background:var(--bg);border-radius:22px;padding:32px 26px;
  border:1.5px solid rgba(74,95,213,.1);
  transition:all .2s;position:relative;overflow:hidden;
}
.how-card:hover{transform:translateY(-4px);border-color:var(--g2);
  box-shadow:0 16px 48px rgba(123,79,168,.12)}
.how-num{
  font-size:72px;font-weight:900;color:rgba(74,95,213,.06);
  position:absolute;top:8px;right:16px;line-height:1;
}
.how-icon{font-size:38px;margin-bottom:18px;display:block}
.how-title{font-size:20px;font-weight:700;margin-bottom:10px;color:var(--ink)}
.how-desc{font-size:14px;color:var(--muted);line-height:1.65}
.how-label{
  display:inline-block;margin-top:18px;
  font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  padding:4px 12px;border-radius:20px;
  background:linear-gradient(135deg,rgba(74,95,213,.1),rgba(123,79,168,.1));
  color:var(--g2);
}

/* ── CURRICULUM ── */
.curr-wrap{max-width:900px}
.group-block{margin-bottom:28px}
.group-header{
  display:flex;align-items:center;gap:12px;
  margin-bottom:12px;padding-bottom:10px;
  border-bottom:2px solid rgba(74,95,213,.1);
}
.group-title{font-size:15px;font-weight:700;color:var(--g2)}
.group-badge{
  font-size:11px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;padding:3px 10px;border-radius:20px;
  background:rgba(74,95,213,.1);color:var(--g1);
}
.curr-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.curr-item{
  background:#fff;border:1.5px solid rgba(74,95,213,.1);
  border-radius:14px;padding:14px 12px;
  display:flex;align-items:center;gap:10px;
  transition:all .2s;
;transition:all .15s}
.curr-item:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(74,95,213,.15);border-color:var(--g1)!important}
.curr-item:hover{border-color:var(--g2);transform:translateY(-2px)}
.curr-n{font-size:18px;font-weight:900;color:var(--g2);min-width:24px}
.curr-t{font-size:12px;font-weight:700;color:var(--ink)}
.curr-s{font-size:11px;color:var(--muted);margin-top:1px}
.test-item{
  background:linear-gradient(135deg,#FFF8E7,#FEF3C7);
  border-color:#E8A020;
}
.test-item .curr-n{color:var(--acc)}
.final-item{
  background:linear-gradient(135deg,rgba(74,95,213,.08),rgba(197,107,158,.08));
  border-color:var(--g2);
}

/* ── WHY ── */
.why-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.why-list{display:flex;flex-direction:column;gap:24px}
.why-item{display:flex;gap:16px}
.why-icon{
  width:46px;height:46px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,rgba(74,95,213,.1),rgba(123,79,168,.1));
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.why-t{font-size:15px;font-weight:700;margin-bottom:4px}
.why-d{font-size:13px;color:var(--muted);line-height:1.6}
.why-visual{
  background:var(--grad);border-radius:28px;
  padding:40px 36px;color:#fff;position:relative;overflow:hidden;
}
.why-visual::before{
  content:'שָׁלוֹם';font-family:'David',Georgia,'Times New Roman',serif;
  font-size:90px;font-weight:900;color:rgba(255,255,255,.08);
  position:absolute;bottom:-10px;right:-10px;line-height:1;
}
.wv-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.5);margin-bottom:20px}
.wv-words{display:flex;flex-direction:column;gap:11px}
.wv-word{
  display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;
}
.wv-he{font-family:'David',Georgia,'Times New Roman',serif;font-size:20px;font-weight:900;
  direction:rtl;min-width:80px}
.wv-bar{flex:1;height:5px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden}
.wv-fill{height:100%;background:var(--acc2);border-radius:5px}
.wv-en{font-size:12px;color:rgba(255,255,255,.6);min-width:60px;text-align:right}

/* ── CTA ── */
.cta-section{
  background:var(--grad);
  padding:110px 48px;text-align:center;
  color:#fff;position:relative;overflow:hidden;
}
.cta-section::before{
  content:'500';font-size:400px;font-weight:900;
  color:rgba(255,255,255,.04);
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;line-height:1;
}
.cta-h2{
  font-size:clamp(34px,5vw,62px);font-weight:900;
  line-height:1.1;letter-spacing:-1.5px;
  margin-bottom:18px;position:relative;z-index:1;
}
.cta-h2 em{font-style:normal;color:var(--acc2)}
.cta-sub{font-size:17px;color:rgba(255,255,255,.75);
  max-width:420px;margin:0 auto 44px;line-height:1.65;
  position:relative;z-index:1}
.btn-cta{
  display:inline-flex;align-items:center;gap:12px;
  background:var(--acc);color:var(--ink);
  padding:19px 48px;border-radius:50px;
  font-size:18px;font-weight:800;text-decoration:none;
  box-shadow:0 8px 36px rgba(232,160,32,.5);
  transition:all .2s;position:relative;z-index:1;
}
.btn-cta:hover{transform:translateY(-3px);box-shadow:0 14px 48px rgba(232,160,32,.6)}
.cta-note{font-size:12px;color:rgba(255,255,255,.4);margin-top:18px;
  position:relative;z-index:1}

/* ── FOOTER ── */
footer{
  background:var(--ink);color:rgba(255,255,255,.6);
  padding:40px 60px;
  display:flex;align-items:center;justify-content:space-between;
}
.foot-logo{font-size:18px;font-weight:800;color:#fff}
.foot-links{display:flex;gap:22px}
.foot-links a{font-size:13px;color:rgba(255,255,255,.5);text-decoration:none;transition:color .2s}
.foot-links a:hover{color:var(--acc2)}
.foot-copy{font-size:12px}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  nav{padding:12px 20px}
  .nav-links{display:none}
  .hero{padding:70px 24px 90px}
  .section{padding:60px 24px}
  .how-grid{grid-template-columns:1fr}
  .why-grid{grid-template-columns:1fr}
  footer{flex-direction:column;gap:16px;text-align:center;padding:28px 24px}
  .foot-links{flex-wrap:wrap;justify-content:center}
}


/* ═══ GAME SHARED CSS ══════════════════════════════════════════ */
.game-page{background:var(--bg);min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}

/* Top bar */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
}
.topbar-left{display:flex;flex-direction:column;gap:3px}
.pill{
  display:inline-flex;align-items:center;
  background:var(--grad);color:#fff;
  font-size:11px;font-weight:700;letter-spacing:1px;
  padding:3px 12px;border-radius:20px;
  width:fit-content;
}
.lesson-name{font-size:15px;font-weight:700;color:var(--deep)}
.topbar-right{display:flex;align-items:center;gap:10px}
.hearts{display:flex;gap:4px;font-size:20px}
.heart.lost{opacity:.25;filter:grayscale(1)}
.xp-badge{
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:var(--deep);font-size:13px;font-weight:800;
  padding:4px 12px;border-radius:20px;
}
.home-btn{
  background:none;border:1.5px solid var(--border);
  color:var(--muted);font-size:18px;cursor:pointer;
  border-radius:10px;padding:4px 8px;transition:all .2s;
}
.home-btn:hover{border-color:var(--g1);color:var(--g1)}

/* Progress bar */
.progress-wrap{padding:10px 20px 6px;background:#fff;border-bottom:1px solid var(--border)}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
.progress-track{height:8px;background:#e2e8f0;border-radius:8px;overflow:hidden;position:relative}
.progress-fill{height:100%;background:var(--grad);border-radius:8px;transition:width .4s ease}
.milestone-row{display:flex;justify-content:space-around;margin-top:5px}
.mdot{width:8px;height:8px;border-radius:50%;background:#e2e8f0;border:2px solid #cbd5e1;transition:all .3s}
.mdot.reached{background:var(--ok);border-color:var(--ok)}
.mdot.current{background:var(--g1);border-color:var(--g1);animation:mdotPulse 1.2s infinite}
@keyframes mdotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

/* Main content area */
.game-body{max-width:520px;margin:0 auto;padding:20px 16px 80px}

/* ── EX1 FLIP CARDS ─────────────────────────────── */
.ex1-instruction{
  background:linear-gradient(135deg,rgba(74,95,213,.07),rgba(197,107,158,.07));
  border:1.5px solid rgba(74,95,213,.15);border-radius:14px;
  padding:12px 16px;margin-bottom:18px;
  text-align:center;
}
.ex1-instruction .inst-he{font-size:14px;font-weight:700;color:var(--g2);margin-bottom:2px;direction:rtl}
.ex1-instruction .inst-en{font-size:12px;color:var(--muted)}

.card-counter{font-size:14px;color:var(--muted);text-align:center;margin-bottom:10px;direction:ltr}

.flip-scene{width:100%;height:260px;perspective:1000px;cursor:pointer;margin-bottom:16px;user-select:none}
.flip-card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.flip-card.flipped{transform:rotateY(180deg)}
.flip-face{
  position:absolute;width:100%;height:100%;border-radius:24px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 24px;box-shadow:var(--shadow);
}
.flip-front{background:var(--white);border:2px solid var(--border)}
.flip-back{background:var(--grad);transform:rotateY(180deg);color:#fff;text-align:center}
.card-tag{position:absolute;top:14px;right:16px;font-size:11px;font-weight:700;letter-spacing:1px;padding:3px 10px;border-radius:12px;text-transform:uppercase}
.tag-noun{background:#ede9fe;color:#6d28d9}
.tag-verb{background:#dbeafe;color:#1d4ed8}
.tag-particle{background:#fef3c7;color:#92400e}
.gender-badge{position:absolute;top:14px;left:16px;font-size:18px}
.card-he{font-family:'David',Georgia,'Times New Roman',serif;font-size:clamp(38px,10vw,62px);font-weight:900;color:var(--deep);text-align:center;line-height:1.1;margin-bottom:8px}
.card-translit{font-size:14px;color:var(--muted);font-style:italic;margin-bottom:4px}
.tap-hint{position:absolute;bottom:14px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.card-en{font-size:clamp(20px,5vw,30px);font-weight:800;margin-bottom:14px;line-height:1.2}
.card-example{font-family:'David',Georgia,'Times New Roman',serif;font-size:19px;font-weight:700;opacity:.95;line-height:1.4;text-align:center;padding:0 8px}
.card-example-en{font-size:12px;opacity:.8;margin-top:6px;font-style:italic}

/* Pair indicator */
.pair-indicator{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:10px;font-size:12px;color:var(--muted)}
.pair-dot{width:10px;height:10px;border-radius:50%;opacity:.3;transition:all .3s}
.pair-dot.male.active{background:#3b82f6;opacity:1}
.pair-dot.female.active{background:#ec4899;opacity:1}

/* Grammar tip */
.grammar-tip{
  background:linear-gradient(135deg,rgba(74,95,213,.08),rgba(123,79,168,.08));
  border:1.5px solid rgba(74,95,213,.2);border-radius:14px;
  padding:14px 16px;margin-bottom:14px;
  font-size:13px;line-height:1.6;color:var(--deep);
  display:none;
}
.grammar-tip.show{display:block}
.tip-he{font-family:'David',Georgia,'Times New Roman',serif;font-size:16px;font-weight:900;color:var(--g2)}

/* Nav buttons */
.card-nav{display:flex;gap:10px;margin-top:4px}
.btn-card-nav{
  flex:1;padding:13px;border-radius:14px;border:none;cursor:pointer;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:700;
  transition:all .15s;
}
.btn-prev{background:#f1f5f9;color:var(--muted)}
.btn-prev:hover:not(:disabled){background:#e2e8f0}
.btn-prev:disabled{opacity:.3}
.btn-next{background:var(--grad);color:#fff;box-shadow:0 4px 16px rgba(74,95,213,.3)}
.btn-next:hover{filter:brightness(1.08)}

/* Finish screen */

function showPage(id){
  if(!id || !LESSON_DATA[id]) id='shiur19_ex1';
  currentPage=id;
  const data=LESSON_DATA[id];
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  if(id.endsWith('_ex1')){ document.getElementById('page-ex1').classList.add('active'); window.scrollTo(0,0); initEx1(data); }
  else if(id.endsWith('_ex2')){ document.getElementById('page-ex2').classList.add('active'); window.scrollTo(0,0); initEx2(data); }
  else if(id.endsWith('_ex3')){ document.getElementById('page-ex3').classList.add('active'); window.scrollTo(0,0); initEx3(data); }
}
function route(){ showPage('shiur19_ex1'); }

function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
}

function launchConfetti(){
  const w=document.getElementById('confettiWrap'); w.innerHTML='';
  const colors=['#4A5FD5','#E8A020','#22c55e','#ef4444','#a855f7','#06b6d4'];
  for(let i=0;i<90;i++){
    const el=document.createElement('div'); el.className='cp';
    el.style.cssText=`left:${Math.random()*100}vw;background:${colors[i%colors.length]};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*.6}s;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'};`;
    w.appendChild(el);
  }
  setTimeout(()=>w.innerHTML='',4500);
}

function showXPPop(txt,el){
  const p=document.getElementById('xpPopup');
  const r=el.getBoundingClientRect();
  p.style.left=(r.left+r.width/2-30)+'px'; p.style.top=(r.top+window.scrollY-20)+'px';
  p.textContent=txt; p.style.display='block'; p.style.animation='none';
  setTimeout(()=>p.style.animation='floatUp 1s ease forwards',10);
  setTimeout(()=>p.style.display='none',1100);
}



//  EX1 — FLIP CARDS
// ═══════════════════════════════════════════════════════
let E1={data:null,idx:0,flipped:false};

function initEx1(data){

function renderEx1(){

  const c=cards[idx];
  const isLast=idx===cards.length-1;
  const tagClass=c.isReview?'tag-particle':c.pos==='verb'?'tag-verb':c.pos==='noun'?'tag-noun':'tag-particle';
  const tagText=c.isReview?'🔄 חזרה · Review':c.pos==='verb'?'🔵 פועל · Verb':c.pos==='noun'?'⬤ שם עצם · Noun':'🟡 מילית · Particle';
  const genderText=c.gender==='M'?'♂':c.gender==='F'?'♀':'';

  let tipHtml='';
  if(c.tip){
    tipHtml=`<div class="grammar-tip" id="gramTip">

  let pairHtml='';
  if(c.pos==='verb'){
    pairHtml=`<div class="pair-indicator">

      <span style="font-size:11px">${c.gender==='M'?'♂ זָכָר · Masculine':'♀ נְקֵבָה · Feminine'}</span>
      <div class="pair-dot female ${c.gender==='F'?'active':''}"></div>
    </div>`;
  }

  area.innerHTML=`
    <div class="ex1-instruction">
      <div class="inst-he">לחץ על הכרטיס כדי לגלות את התרגום</div>
      <div class="inst-en">👆 Tap each card to reveal the translation, then click <strong>Next</strong>. Be honest — learning works best when you are!</div>
    </div>
    <div class="card-counter" dir="ltr">${idx+1} / ${cards.length}</div>
    ${pairHtml}
    <div class="flip-scene" id="flipScene" tabindex="0" role="button" aria-label="Flip card">
      <div class="flip-card" id="flipCard">
        <div class="flip-face flip-front">
          <div class="card-tag ${tagClass}">${tagText}</div>
          <div class="gender-badge">${genderText}</div>
          <div class="card-he">${c.he}</div>
          <div class="card-translit">${c.translit}</div>
          <div class="tap-hint">👆 הפוך · Flip</div>
        </div>
        <div class="flip-face flip-back">
          <div class="card-he" style="font-size:clamp(22px,5vw,30px);font-weight:800;margin-bottom:10px">${c.en}</div>
          <div class="card-example">${c.example}</div>
          <div class="card-example-en">${c.exampleEn||''}</div>
        </div>
      </div>
    </div>

      <button class="btn-card-nav btn-prev" id="btnPrev" ${idx===0?'disabled':''} onclick="ex1Prev()">→ הקודם</button>
      <button class="btn-card-nav btn-next" onclick="ex1Next()">${isLast?'סיים ✓ Finish':'הבא ← Next'}</button>
    </div>
  `;

  // Attach flip listeners AFTER innerHTML
  const scene=document.getElementById('flipScene');

  scene.addEventListener('click',()=>ex1Flip(card,c));

function ex1Flip(card,c){
  E1.flipped=!E1.flipped;

}

function ex1Next(){

}

document.addEventListener('keydown',e=>{

const XP_C=10, XP_COMBO=5;

function initEx2(data){

function ex2Check(btn,chosen,q){

let E3={data:null,qs:[],idx:0,hearts:3,xp:0,combo:0,maxCombo:0,correct:0,answered:false};

function initEx3(data){
  E3={data,qs:shuffle(data.questions),idx:0,hearts:3,xp:0,combo:0,maxCombo:0,correct:0,answered:false};
  const _ln3=(data.id.match(/shiur(\d+)/)||['','?'])[1];
  document.getElementById('ex3-pill').textContent='שיעור '+_ln3+' · Lesson '+_ln3;
  document.getElementById('ex3-name').textContent='Exercise 3 of 3: Sentence Completion ✍️';
  document.getElementById('ex3-xp').textContent='0';
  updateHearts(3,3); updateProgress(3,0,E3.qs.length);
  renderEx3Q();
}

function renderEx3Q(){
  const area=document.getElementById('ex3-area');
  if(E3.idx>=E3.qs.length){ex3Success();return;}
  E3.answered=false;
  const q=E3.qs[E3.idx];

  // Detect schema: pre/post (most lessons) vs type/blank (L4)
  const usePrePost = q.pre !== undefined;
  const isTypeA    = !usePrePost && q.type==='A';

  let instHe = 'בחר את הצורה הנכונה להשלמת המשפט';
  let instEn = '📖 Read the English hint — choose the correct missing Hebrew word. 3 lives ❤️ · <strong>70%+ to pass.</strong>';

  // Build sentence display
  let sentenceHtml='';
  if(usePrePost){
    const preText  = q.pre  ? `<span class="q-pre">${q.pre}</span> ` : '';
    const postText = q.post ? ` <span class="q-post">${q.post}</span>` : '';
    sentenceHtml = `<div class="q-sentence" dir="rtl">${preText}<span class="blank-slot">_______</span>${postText}</div>`;
  } else if(isTypeA){
    sentenceHtml = `<div class="q-sentence" dir="rtl">${q.blank.replace('_______','<span class="blank-slot">_______</span>')}</div>`;
  }

  // Build options — Type B has object options {text,key,isCorrect}, others are plain strings
  const opts = shuffle([...q.options]);
  const isTypeB = opts.length > 0 && typeof opts[0] === 'object' && opts[0] !== null;
  const optsHtml = isTypeB
    ? `<div class="opts-1col" id="ex3-opts">` +
        opts.map(o=>`<button class="opt-btn" dir="rtl" data-val="${o.text.replace(/"/g,'&quot;')}">${o.text}</button>`).join('') +
      `</div>`
    : `<div class="opts-2col" id="ex3-opts">` +
        opts.map(o=>`<button class="opt-btn" data-val="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('') +
      `</div>`;

  area.innerHTML=`
    <div class="ex-instruction">
      <div class="inst-row"><div class="inst-he">${instHe}</div></div>
      <div class="inst-en">${instEn}</div>
    </div>
    <div class="q-card" id="ex3-qcard">
      <div class="q-en">${q.en||''}</div>
      ${sentenceHtml}
      ${optsHtml}
    </div>
    <div class="feedback-banner" id="ex3-fb"></div>
    <button class="continue-btn" id="ex3-cont">המשך · Continue →</button>
  `;

  document.querySelectorAll('#ex3-opts .opt-btn').forEach(btn=>{
    btn.addEventListener('click',()=>ex3Check(btn,q));
  });
  document.getElementById('ex3-cont').addEventListener('click',()=>ex3Next());
}

function ex3Check(btn,q){
  if(E3.answered)return;
  E3.answered=true;
  const chosen = btn.dataset.val;

  // Determine correct answer string
  let correctStr;
  if(q.pre!==undefined){
    // pre/post schema: correct is an integer index
    correctStr = q.options[q.correct];
  } else {
    // type/blank schema: correct is already a string
    correctStr = q.correct;
  }

  const ok = chosen === correctStr;

  // Mark all buttons
  document.querySelectorAll('#ex3-opts .opt-btn').forEach(b=>{
    b.disabled=true;
    if(b.dataset.val===correctStr) b.classList.add('show-answer');
  });

  if(ok){
    E3.correct++; E3.combo++; if(E3.combo>E3.maxCombo) E3.maxCombo=E3.combo;
    const earned=XP_C+(E3.combo>=3?XP_COMBO:0);
    E3.xp+=earned;
    document.getElementById('ex3-xp').textContent=E3.xp;
    btn.classList.add('sel-correct');
    document.getElementById('ex3-qcard').classList.add('correct');
    const ruleText = q.rule || (q.feedback && q.feedback.rule) || '';
    ex3Feedback(true, ruleText);
    
    showXPPop('+'+earned+'⭐', btn);
  } else {
    E3.combo=0; E3.hearts--;
    btn.classList.add('sel-wrong');
    document.getElementById('ex3-qcard').classList.add('wrong');
    const ruleText = q.rule || (q.feedback && q.feedback.rule) || '';
    ex3Feedback(false, ruleText);
    updateHearts(3,E3.hearts);
    if(E3.hearts<=0){ setTimeout(ex3Fail,900); return; }
  }

  const cont=document.getElementById('ex3-cont');
  if(cont) cont.classList.add('show');
}

function ex3Feedback(ok,rule){
  const fb=document.getElementById('ex3-fb');
  fb.className='feedback-banner show '+(ok?'fb-ok':'fb-err');
  fb.innerHTML=`<div class="fb-row1">${ok?'✅':'❌'} ${ok?'כֵּן! נָכוֹן! · Correct!':'לֹא נָכוֹן · Not quite'}</div>
    ${rule?`<div class="fb-rule">${rule}</div>`:''}`;
}

function ex3Next(){E3.idx++;renderEx3Q();updateProgress(3,E3.idx,E3.qs.length);}

function ex3Success(){
  const bonus=E3.correct===E3.qs.length?20:0;
  if(bonus)E3.xp+=bonus;
  const acc=Math.round(E3.correct/E3.qs.length*100);
  const nextLesson=parseInt(E3.data.id.match(/shiur(\d+)/)[1])+1;
  const isLast=nextLesson>26;
  // ── 70% gate ──
  if(acc<70){
    document.getElementById('ex3-area').innerHTML=`
      <div class="result-screen show">
        <div class="result-icon">📖</div>
        <div class="result-title">Almost! · עוד קצת!</div>
        <div class="result-sub">You scored <strong>${acc}%</strong> — you need <strong>70%</strong> to complete the lesson.<br>Review the vocab quiz and try again!</div>
        <div class="result-stats">
          <div class="rstat"><div class="rstat-n">${acc}%</div><div class="rstat-l">Your score</div></div>
          <div class="rstat"><div class="rstat-n">70%</div><div class="rstat-l">Needed ✓</div></div>
          <div class="rstat"><div class="rstat-n">${E3.correct}/${E3.qs.length}</div><div class="rstat-l">Correct</div></div>
        </div>
        <div class="result-btns">
          <button class="btn-go-next" onclick="initEx3(E3.data)">Try again 🔄 · נסה שוב</button>
          <button class="btn-retry" onclick="goto('${E3.data.id.replace('_ex3','_ex2')}')">← Review Vocab Quiz first</button>
        </div>
      </div>`;
    document.getElementById('ex3-bar').style.width=acc+'%';
    return;
  }
  document.getElementById('ex3-area').innerHTML=`
    <div class="result-screen show">
      <div class="result-icon">🌟</div>
      <div class="result-title">שיעור הושלם! · Lesson Complete!</div>
      <div class="result-sub">סיימת את כל 3 התרגילים · All 3 exercises done — ${acc}% ✓</div>
      <div class="result-stats">
        <div class="rstat"><div class="rstat-n">${E3.xp}⭐</div><div class="rstat-l">XP</div></div>
        <div class="rstat"><div class="rstat-n">${acc}%</div><div class="rstat-l">Accuracy</div></div>
        <div class="rstat"><div class="rstat-n">${E3.maxCombo}🔥</div><div class="rstat-l">Combo</div></div>
      </div>
      <div class="result-btns">
        ${isLast
          ?``
          :`<button class="btn-go-next" onclick="goto('${E3.data.next}')">המשך לשיעור ${nextLesson} · Next Lesson →</button>`}
        
      </div>
    </div>`;
  document.getElementById('ex3-bar').style.width='100%';
  launchConfetti();
  markDone(E3.data.id,(E3.data.xp||50)+E3.xp);
}

function ex3Fail(){
  document.getElementById('ex3-area').innerHTML=`
    <div class="result-screen show">
      <div class="result-icon">💔</div>
      <div class="result-title">נגמרו הלבבות · No more hearts!</div>
      <div class="result-sub">נסה שוב — את יכול! · Try again — you can do it!</div>
      <div class="result-btns">
        <button class="btn-go-next" onclick="initEx3(E3.data)">נסה שוב · Try again 🔄</button>
        
      </div>
    </div>`;
}

// ═══════════════════════════════════════════════════════
//  SHARED PROGRESS + HEARTS HELPERS
// ═══════════════════════════════════════════════════════
function updateHearts(ex,n){
  ['h1','h2','h3'].forEach((id,i)=>{
    const el=document.getElementById('ex'+ex+'-'+id);
    if(el)el.classList.toggle('lost',i>=n);
  });
}

function updateProgress(ex,idx,total){
  const pct=Math.round((idx/total)*100);
  const bar=document.getElementById('ex'+ex+'-bar');
  const lbl=document.getElementById('ex'+ex+'-prog-label');
  const pctEl=document.getElementById('ex'+ex+'-prog-pct');
  if(bar)bar.style.width=pct+'%';
  if(lbl)lbl.textContent=idx+' / '+total+' שאלות · questions';
  if(pctEl)pctEl.textContent=pct+'%';
  // milestones
  const wrap=document.getElementById('ex'+ex+'-milestones');
  if(wrap){
    wrap.innerHTML='';
    [.25,.5,.75,1].forEach(m=>{
      const d=document.createElement('div');
      const p=idx/total;
      d.className='mdot'+(p>m?' reached':p>=m-.01?' current':'');
      wrap.appendChild(d);
    });
  }
}
